name: document-server-behavior
description: Basic tool-selection cases for a document MCP server
pass_threshold: 0.8
cases:
  - id: search-by-keyword
    request: Find documents about quarterly revenue
    expected_tool:
      name: search_documents
      arguments:
        query: quarterly revenue
    tags: [search]
  - id: fetch-by-id
    request: Get document doc-12345
    expected_tool:
      name: fetch_document
      arguments:
        document_id: doc-12345
    tags: [fetch]
