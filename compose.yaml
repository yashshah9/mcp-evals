services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - .:/app
    env_file:
      - .env.example
    working_dir: /app
    command: ["mcp-evals", "health"]

  test:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - .:/app
    working_dir: /app
    command: ["pytest", "tests/", "-v"]

  lint-example:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - .:/app
    working_dir: /app
    command: ["mcp-evals", "lint", "--live", "examples/server.yaml"]

  discover-example:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - .:/app
    working_dir: /app
    command: ["mcp-evals", "discover", "examples/server.yaml"]

  run-example:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - .:/app
    working_dir: /app
    command:
      [
        "mcp-evals",
        "run",
        "examples/eval-suite.yaml",
        "--catalog",
        "examples/tools.yaml",
        "--model",
        "mock",
      ]
