[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-evals"
version = "0.2.0"
description = "Behavioral evaluation and description linting for MCP servers"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "mcp-evals contributors" }]
keywords = ["mcp", "model-context-protocol", "testing", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "rich>=13.7",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]
mcp = ["mcp>=1.0"]

[project.scripts]
mcp-evals = "mcp_evals.cli:main"

[project.urls]
Homepage = "https://github.com/example/mcp-evals"
Documentation = "https://github.com/example/mcp-evals#readme"
Issues = "https://github.com/example/mcp-evals/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mcp_evals"]

[tool.coverage.run]
source = ["mcp_evals"]
